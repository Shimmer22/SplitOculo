<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitOculo Demo</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">SplitOculo <span>Demo</span></div>
      <div class="muted">端云协同视觉推理测试台</div>
    </div>
    <div class="top-actions">
      <span id="server-state" class="state offline">云端未启动</span>
      <button id="server-button" class="button secondary">启动云端</button>
      <button id="settings-button" class="button secondary">设置</button>
    </div>
  </header>

  <main class="page">
    <section class="card input-card">
      <div class="section-title"><h2>输入</h2><span id="input-kind" class="tag">未选择</span></div>
      <div id="dropzone" class="dropzone">
        <div class="drop-title">拖入图片、视频或裸帧文件</div>
        <div class="muted">支持 PNG / JPEG（不同质量）/ WebP、H.264 / H.265 视频、RGB/BGR/灰度裸帧</div>
        <button id="choose-input" class="button primary">选择文件</button>
        <input id="input-file" type="file" hidden accept="image/*,video/*,.mp4,.mkv,.mov,.avi,.h264,.h265,.hevc,.raw,.rgb,.bgr,.yuv">
      </div>
      <div id="selected-input" class="selected-input hidden"></div>
      <div id="media-info" class="muted media-info"></div>
      <div class="field">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" rows="3">请描述视频。</textarea>
      </div>
    </section>

    <section class="card controls-card">
      <div class="section-title"><h2>项目输入</h2><span class="muted">按列表顺序执行，可重复</span></div>
      <div id="projects-list" class="projects-list"><div class="empty project-empty">尚未添加项目。</div></div>
      <button id="add-project" class="button secondary add-project">＋ 添加项目</button>
      <div class="bandwidth-box">
        <label class="switch-row"><input id="bandwidth-enabled" type="checkbox"><span>模拟带宽限制</span></label>
        <div class="bandwidth-inputs">
          <select id="bandwidth-preset">
            <option value="62.5">BLE · 62.5 KB/s</option>
            <option value="125">BLE · 125 KB/s</option>
            <option value="0">不限制</option>
            <option value="custom">手动输入</option>
          </select>
          <input id="bandwidth-custom" type="number" min="0.1" step="0.1" placeholder="KB/s" disabled>
        </div>
      </div>
      <button id="run-button" class="button primary run-button" disabled>开始推理</button>
      <div id="run-status" class="muted status-line"></div>
    </section>

    <section class="card results-card">
      <div class="section-title"><h2>结果</h2><button id="clear-results" class="button link-button">清空</button></div>
      <div id="results"><div class="empty">运行后显示响应与时延指标。</div></div>
    </section>
  </main>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-panel">
      <div class="section-title"><h2>设置</h2><button id="close-settings" class="button link-button">关闭</button></div>
      <div class="settings-grid">
        <label>Python 路径<input id="setting-python" type="text"></label>
        <label>云端 checkpoint<input id="setting-cloud-checkpoint" type="text"></label>
        <label>端侧 checkpoint<input id="setting-edge-checkpoint" type="text"></label>
        <label>时序融合 checkpoint<input id="setting-temporal-checkpoint" type="text"></label>
        <label>Qwen 模型路径<input id="setting-qwen" type="text"></label>
        <label>服务器 IP / 地址<input id="setting-server-address" type="text"></label>
        <label>云端监听地址<input id="setting-host" type="text"></label>
        <label>端口<input id="setting-port" type="number"></label>
        <label>设备<select id="setting-device"><option value="cuda">CUDA</option><option value="cpu">CPU</option></select></label>
        <label>超时（秒）<input id="setting-timeout" type="number"></label>
        <label>输入视频总帧数<input id="setting-max-frames" type="number" min="1"></label>
        <label>视频采样 FPS<input id="setting-sample-fps" type="number" min="0.1" step="0.1"></label>
        <label>空间 payload<input id="setting-spatial-level" type="text" placeholder="49x64"></label>
        <label>裸帧宽<input id="setting-raw-width" type="number"></label>
        <label>裸帧高<input id="setting-raw-height" type="number"></label>
        <label>裸帧 FPS<input id="setting-raw-fps" type="number" step="0.1"></label>
        <label>裸帧格式<select id="setting-raw-format"><option value="rgb24">RGB24</option><option value="bgr24">BGR24</option><option value="gray8">GRAY8</option></select></label>
      </div>
      <label class="switch-row inline"><input id="setting-offline" type="checkbox"><span>离线加载 Qwen 缓存</span></label>
      <label class="switch-row inline"><input id="setting-preload" type="checkbox"><span>启动服务器时预加载 Qwen</span></label>
      <div class="muted settings-note">模型输入尺寸由 checkpoint 决定；当前默认 checkpoint 使用 224×224。裸帧宽高只用于解析裸帧文件，不会改变模型输入尺寸。</div>
      <button id="save-settings" class="button primary">保存设置</button>
      <div id="settings-message" class="muted status-line"></div>
    </div>
  </div>
  <script src="renderer/demo.js"></script>
</body>
</html>
